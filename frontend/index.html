<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Helper — Exam Mode</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Vendor libs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!--
    Load order matters:
    1. Services  (plain JS, no JSX)
    2. Shared UI (components used by others)
    3. Tab components (each self-contained)
    4. App root  (assembles everything)
  -->

  <!-- 1. Services -->
  <script src="js/services/api.js"></script>

  <!-- 2. Shared components -->
  <script type="text/babel" src="js/components/Shared.jsx"></script>

  <!-- 3. Tab components -->
  <script type="text/babel" src="js/components/QuizTab.jsx"></script>
  <script type="text/babel" src="js/components/ExplainTab.jsx"></script>
  <script type="text/babel" src="js/components/FlashcardsTab.jsx"></script>
  <script type="text/babel" src="js/components/ChatTab.jsx"></script>

  <!-- 4. App root -->
  <script type="text/babel" src="js/App.jsx"></script>
</body>
</html>
